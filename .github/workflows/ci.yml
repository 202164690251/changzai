name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck (app)
        run: pnpm --filter @changzai/app exec tsc --noEmit
      - name: Typecheck (core + shared)
        run: pnpm exec tsc -p packages/core/tsconfig.json --noEmit
      - name: Core unit tests (Node 24 native TS)
        shell: bash
        run: |
          set -e
          for f in packages/core/test/*.test.ts; do
            echo "== $f"
            node --test "$f"
          done
      - name: Eval harness
        run: node scripts/eval.ts
      - name: Web build
        run: pnpm --filter @changzai/app build

  rust:
    name: rust
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure OpenSSL (sqlcipher-system)
        shell: pwsh
        run: |
          function Find-OpenSSL {
            $roots = @(
              'C:\Program Files\OpenSSL-Win64',
              'C:\Program Files\OpenSSL-Win32',
              'C:\Program Files\OpenSSL'
            )
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $hit = Get-ChildItem $root -Recurse -Filter 'libcrypto.lib' -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($hit) {
                $libDir = $hit.DirectoryName
                $includeDir = $null
                $ssl = Get-ChildItem $root -Recurse -Filter 'ssl.h' -ErrorAction SilentlyContinue |
                  Where-Object { $_.DirectoryName -like '*\include\openssl' } |
                  Select-Object -First 1
                if ($ssl) { $includeDir = Split-Path $ssl.DirectoryName -Parent }
                return [pscustomobject]@{ LibDir = $libDir; IncludeDir = $includeDir }
              }
            }
            return $null
          }

          $found = Find-OpenSSL
          if (-not $found) {
            choco install openssl -y --no-progress
            $env:Path = 'C:\Program Files\OpenSSL\bin;' + $env:Path
            $found = Find-OpenSSL
          }
          if (-not $found) { throw 'OpenSSL not found after install' }
          "OPENSSL_LIB_DIR=$($found.LibDir)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($found.IncludeDir) {
            "OPENSSL_INCLUDE_DIR=$($found.IncludeDir)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $bin = Join-Path (Split-Path (Split-Path $found.LibDir -Parent) -Parent) 'bin'
          if (Test-Path $bin) { $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
          Write-Host "OpenSSL lib=$($found.LibDir) include=$($found.IncludeDir)"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target
      - name: Cargo tests (SQLCipher + FTS5 + encryption probes)
        working-directory: apps/app/src-tauri
        run: cargo test --lib
        env:
          RUST_BACKTRACE: 1
