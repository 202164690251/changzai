[package]
name = "changzai"
version = "0.1.0"
description = "常在 Still Here · Windows PC 单端"
authors = ["changzai"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "changzai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 数据库：
# 本机 Step 1 使用 plain SQLite + 应用层 AES-256-GCM 封装做加密 spike。
# SQLCipher 需要 Perl + NASM + OpenSSL，本机暂缺，切换方式见 docs/step1-spike-report.md：
# rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# 加密原语（纯 Rust，无需 OpenSSL）
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

# Rust 侧流式 HTTP（后续模型调用复用）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
