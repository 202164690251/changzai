<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>常在桌宠</title>
    <script src="/live2dcubismcore.min.js"></script>
  </head>
  <body class="pet-body">
    <div id="pet-root">
      <div id="pet-bubble" class="pet-bubble" hidden></div>
      <div id="pet-stage" class="pet-stage" title="单击说话，双击打开聊天，拖动移动">
        <img id="pet-image" class="pet-image" alt="" draggable="false" />
        <img id="pet-head" class="pet-head" alt="" draggable="false" hidden />
        <div id="pet-fallback" class="pet-fallback">ta</div>
        <div id="pet-live2d" class="pet-live2d" hidden></div>
      </div>
      <div id="pet-name" class="pet-name">ta</div>
      <div id="pet-status" class="pet-status"><i></i><span>在线</span></div>

      <div id="pet-chat-panel" class="pet-chat-panel" hidden>
      <form id="pet-chat" class="pet-chat">
        <input id="pet-input" type="text" maxlength="300" placeholder="和 ta 说点什么…" autocomplete="off" />
        <button id="pet-mic" type="button" class="pet-icon-btn" title="语音输入" aria-label="语音输入">🎙</button>
        <button type="submit" class="pet-send-btn">发送</button>
      </form>
      <div id="pet-quick" class="pet-quick">
        <button type="button" data-quick="嗯嗯">嗯嗯</button>
        <button type="button" data-quick="在忙，晚点说">在忙</button>
        <button type="button" data-quick="怎么啦？">怎么啦</button>
        <button type="button" data-quick="晚点聊">晚点聊</button>
      </div>
      </div>
    </div>

    <div id="pet-menu" class="pet-menu" hidden>
      <button type="button" data-action="chat">打开聊天</button>
      <button type="button" data-action="auto">自动动效</button>
      <button type="button" data-action="motion">随机动作</button>
      <button type="button" data-action="expression">随机表情</button>
      <button type="button" data-action="pat">摸摸头</button>
      <button type="button" data-action="feed">喂一口</button>
      <button type="button" data-action="mini">Mini 模式</button>
      <button type="button" data-action="hide">隐藏桌宠</button>
      <button type="button" data-action="close">关闭桌宠</button>
    </div>
    <script type="module" src="/src/pet.ts"></script>
  </body>
</html>
